[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-multimodal-analysis"
version = "0.1.0"
description = "Multimodal fine-grained semantic analysis for e-commerce fashion images"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.46,<5",
  "numpy>=1.26",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fashion_multimodal_analysis = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["fashion_multimodal_analysis"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src/fashion_multimodal_analysis"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
