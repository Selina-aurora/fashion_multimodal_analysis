name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Black check
        run: black --check src tests

      - name: Import-order check
        run: isort --check-only src tests

      - name: Flake8 check
        run: flake8 src tests

      - name: Mypy check
        run: mypy src/fashion_multimodal_analysis/grounding

      - name: Pylint error check
        run: pylint --errors-only src/fashion_multimodal_analysis

      - name: Compile experiment scripts
        run: python -m compileall -q scripts

      - name: Unit tests
        run: pytest -q
