name: python_checks
on: [push, pull_request]
jobs:
  shared_logic_and_style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements_dev.txt
      - run: python -m black --check src scripts tests fix_checkpoint_loading.py
      - run: python -m isort --check-only src scripts tests fix_checkpoint_loading.py
      - run: python -m ruff check src scripts tests fix_checkpoint_loading.py
      - run: python -m mypy
      - run: python -m unittest discover -s tests -v
